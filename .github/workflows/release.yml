name: Release

# Push a tag like v0.1.0 to build both architectures and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: x64,   rid: win-x64 }
          - { platform: ARM64, rid: win-arm64 }
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Publish (self-contained)
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish Updraft/Updraft.csproj -c Release `
            -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} --self-contained true `
            -p:Version=$version -o publish/${{ matrix.rid }}

      - name: Zip
        shell: pwsh
        run: |
          $zip = "Updraft-$($env:TAG)-${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $zip -CompressionLevel Optimal
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          $version = ($env:TAG.TrimStart('v') -replace '[-+].*', '')   # numeric part only
          $arch = '${{ matrix.rid }}'.Replace('win-', '')
          $name = "Updraft-$($env:TAG)-${{ matrix.rid }}-setup"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DVersion=$version" "/DArch=$arch" `
            "/DSourceDir=$PWD\publish\${{ matrix.rid }}" "/DOutputDir=$PWD" "/F$name" installer\updraft.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "SETUP=$name.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.exe *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Publish GitHub release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Updraft $TAG" --generate-notes \
              --notes "**Install:** download the \`-setup.exe\` for your CPU, **win-x64** (Intel/AMD) or **win-arm64** (Windows on ARM), and run it. **Portable:** the \`.zip\` needs no install, just extract and run Updraft.exe. Verify downloads with SHA256SUMS.txt. The binaries are not code-signed yet, so SmartScreen may show a warning (More info, then Run anyway)."
          fi
