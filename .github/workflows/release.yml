name: Release

# Push a tag like v0.1.0 to build both architectures, publish a GitHub release and submit to the Microsoft Store.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: x64,   rid: win-x64 }
          - { platform: ARM64, rid: win-arm64 }
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PFX_B64: ${{ secrets.MSIX_PFX_BASE64 }}   # job-level so step `if:` conditions can see whether signing is set up
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Publish (self-contained)
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish UpInstall/UpInstall.csproj -c Release `
            -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} --self-contained true `
            -p:Version=$version -o publish/${{ matrix.rid }}

      - name: Zip
        shell: pwsh
        run: |
          # Version-free names so https://github.com/<repo>/releases/latest/download/<name> is a stable direct link
          $zip = "UpInstall-${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $zip -CompressionLevel Optimal
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          $version = ($env:TAG.TrimStart('v') -replace '[-+].*', '')   # numeric part only
          $arch = '${{ matrix.rid }}'.Replace('win-', '')
          $name = "UpInstall-${{ matrix.rid }}-setup"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DVersion=$version" "/DArch=$arch" `
            "/DSourceDir=$PWD\publish\${{ matrix.rid }}" "/DOutputDir=$PWD" "/F$name" installer\upinstall.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "SETUP=$name.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}
          if-no-files-found: error

      # Signed per-architecture .msix, combined into one .msixbundle by the "bundle" job.
      # Skipped (not failed) when the signing secrets are not configured. See packaging/README.md.
      - name: Build signed MSIX
        if: env.PFX_B64 != ''
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $version = ($env:TAG.TrimStart('v') -replace '[-+].*', '')
          $arch = '${{ matrix.rid }}'.Replace('win-', '')
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          try {
            ./packaging/build-msix.ps1 -PublishDir "publish/${{ matrix.rid }}" -Arch $arch -Version $version `
              -OutFile "msix/UpInstall-${{ matrix.rid }}.msix" -PfxPath $pfx -PfxPassword $env:PFX_PASSWORD
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v7
        if: env.PFX_B64 != ''
        with:
          name: msix-${{ matrix.rid }}
          path: msix/*.msix
          if-no-files-found: error

      # Unsigned per-architecture .msix with the Microsoft Store identity. Microsoft re-signs it for free on
      # certification, so no certificate is involved. Always built; submitted by the "store" job.
      - name: Build Store MSIX (unsigned)
        shell: pwsh
        run: |
          $version = ($env:TAG.TrimStart('v') -replace '[-+].*', '')
          $arch = '${{ matrix.rid }}'.Replace('win-', '')
          ./packaging/build-msix.ps1 -PublishDir "publish/${{ matrix.rid }}" -Arch $arch -Version $version `
            -OutFile "store/UpInstall-${{ matrix.rid }}.msix" `
            -IdentityName '${{ vars.STORE_IDENTITY_NAME || 'BilalAnsari.UpInstall' }}' `
            -Publisher '${{ vars.STORE_PUBLISHER || 'CN=1C7A51E9-3ED2-476B-B6C8-5086736F112C' }}' `
            -PublisherDisplayName '${{ vars.STORE_PUBLISHER_DISPLAY_NAME || 'Bilal Ansari' }}'

      - uses: actions/upload-artifact@v7
        with:
          name: store-${{ matrix.rid }}
          path: store/*.msix
          if-no-files-found: error

  bundle:
    name: Bundle MSIX
    needs: build
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PFX_B64: ${{ secrets.MSIX_PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        if: env.PFX_B64 != ''
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        if: env.PFX_B64 != ''
        with:
          dotnet-version: 9.0.x

      - uses: actions/download-artifact@v8
        if: env.PFX_B64 != ''
        with:
          pattern: msix-*
          path: msix-in
          merge-multiple: true

      - name: Create signed .msixbundle and certificate
        if: env.PFX_B64 != ''
        shell: pwsh
        run: |
          dotnet restore UpInstall/UpInstall.csproj   # brings in makeappx and signtool (Windows SDK build tools)
          $version = ($env:TAG.TrimStart('v') -replace '[-+].*', '')
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          New-Item -ItemType Directory msix-out | Out-Null
          try {
            ./packaging/bundle-msix.ps1 -InputDir msix-in -Version $version `
              -OutFile msix-out/UpInstall.msixbundle -PfxPath $pfx -PfxPassword $env:PFX_PASSWORD
            # Public certificate people trust to install the sideload package (no private key in it).
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:PFX_PASSWORD)
            [IO.File]::WriteAllBytes('msix-out/UpInstall-signing.cer', $cert.Export('Cert'))
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v7
        if: env.PFX_B64 != ''
        with:
          name: msix-bundle
          path: msix-out/*
          if-no-files-found: error

  # Bundles the unsigned Store packages and submits them to the Microsoft Store through the Store Developer CLI.
  # Needs the Partner Center secrets listed in packaging/README.md; without them the bundle is only uploaded as an
  # artifact. Pre-release tags (v1.2.3-beta1) are never submitted.
  store:
    name: Microsoft Store
    needs: build
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID || '9PMB0883K391' }}
      PC_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - uses: actions/download-artifact@v8
        with:
          pattern: store-*
          path: store-in
          merge-multiple: true

      - name: Create Store bundle
        shell: pwsh
        run: |
          dotnet restore UpInstall/UpInstall.csproj   # brings in makeappx (Windows SDK build tools)
          $version = ($env:TAG.TrimStart('v') -replace '[-+].*', '')
          New-Item -ItemType Directory store-out | Out-Null
          ./packaging/bundle-msix.ps1 -InputDir store-in -Version $version -OutFile store-out/UpInstall.msixbundle
          # .msixupload is a zip holding the bundle; it is the format the Store CLI/API expects.
          Compress-Archive store-out/UpInstall.msixbundle store-out/UpInstall.zip
          Rename-Item store-out/UpInstall.zip UpInstall.msixupload

      - uses: actions/upload-artifact@v7
        with:
          name: store-bundle
          path: store-out/*
          if-no-files-found: error

      - name: Set up Microsoft Store Developer CLI
        if: env.PC_TENANT_ID != '' && !contains(env.TAG, '-')
        uses: microsoft/setup-msstore-cli@v1

      - name: Submit to Microsoft Store
        if: env.PC_TENANT_ID != '' && !contains(env.TAG, '-')
        shell: pwsh
        env:
          PC_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PC_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PC_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:PC_TENANT_ID --sellerId $env:PC_SELLER_ID `
            --clientId $env:PC_CLIENT_ID --clientSecret $env:PC_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }
          # Replaces the pending draft with this package and commits it for certification.
          msstore publish store-out -i store-out/UpInstall.msixupload -id $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }

  release:
    name: Create release
    needs: [build, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      PFX_B64: ${{ secrets.MSIX_PFX_BASE64 }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: win-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: env.PFX_B64 != ''
        with:
          name: msix-bundle
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum $(ls *.exe *.zip *.msixbundle *.cer 2>/dev/null) > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/*.msixbundle

      - name: Publish GitHub release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "UpInstall $TAG" --generate-notes \
              --notes "**Install:** download the \`-setup.exe\` for your CPU, **win-x64** (Intel/AMD) or **win-arm64** (Windows on ARM), and run it. **Portable:** the \`.zip\` needs no install, just extract and run UpInstall.exe. **MSIX (optional):** if this release has an \`UpInstall.msixbundle\`, trust \`UpInstall-signing.cer\` first (see packaging/README.md), then open the bundle. Verify downloads with SHA256SUMS.txt. The binaries are not code-signed yet, so SmartScreen may show a warning (More info, then Run anyway)."
          fi
